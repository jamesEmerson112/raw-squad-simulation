[project]
name = "encapsulated-spark"
version = "0.1.0"
description = "Battlefield simulation where each unit's discipline drives behavior."
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
